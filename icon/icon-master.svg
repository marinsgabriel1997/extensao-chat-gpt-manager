<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c7a0"/>
      <stop offset="100%" stop-color="#008f73"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c323a"/>
      <stop offset="100%" stop-color="#11151a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Transparent canvas -->

  <!-- Back window -->
  <g filter="url(#shadow)">
    <rect x="90" y="105" width="650" height="650" rx="92"
          fill="url(#dark)" stroke="#ffffff" stroke-width="36"/>
  </g>

  <!-- Green overlap accent -->
  <path d="M690 175 L890 355 L690 355 Z" fill="url(#green)" opacity="0.95"/>

  <!-- Front window -->
  <g filter="url(#shadow)">
    <rect x="260" y="275" width="675" height="600" rx="92"
          fill="url(#green)" stroke="#ffffff" stroke-width="36"/>
  </g>

  <!-- Geometric knot -->
  <g transform="translate(598 575)" fill="none" stroke="#ffffff" stroke-width="42"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- six interlocking arms -->
    <path d="M 0,-190 L 155,-100 L 155,80 L 0,170 L -155,80 L -155,-100 Z"/>
    <path d="M 0,-190 L 0,-35 L 134,42"/>
    <path d="M 155,-100 L 22,-23 L 22,132"/>
    <path d="M 155,80 L 20,2 L -114,80"/>
    <path d="M 0,170 L 0,15 L -134,-62"/>
    <path d="M -155,80 L -22,3 L -22,-132"/>
    <path d="M -155,-100 L -20,-22 L 114,-100"/>
  </g>

  <!-- Perfect circular center -->
  <circle cx="598" cy="575" r="76" fill="url(#green)"/>
</svg>
