<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT Manager</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #212121;
        color: #f4f4f4;
      }

      * {
        box-sizing: border-box;
      }

      /* Classes com `display` próprio não podem anular o atributo `hidden`. */
      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-width: 320px;
        overflow: hidden;
        background: #212121;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      label {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      /* Layout em faixas: topo (cabeçalho, busca, pastas) e barra de seleção
         ficam fixos; somente a área da lista rola. */
      .app {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        flex: none;
        padding: 14px 16px;
        background: #212121;
        border-bottom: 1px solid #383838;
      }

      .tabs {
        display: flex;
        gap: 4px;
        margin: 10px 0 -14px;
      }

      .tab {
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 8px 12px;
        background: transparent;
        color: #b4b4b4;
        font-size: 12px;
        font-weight: 680;
      }

      .tab.active {
        color: #f4f4f4;
        border-bottom-color: #f4f4f4;
      }

      .toolbar {
        flex: none;
        padding: 12px 16px 0;
        border-bottom: 1px solid #383838;
      }

      .scroll-area {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 12px 16px 0;
      }

      .brand-row,
      .selection-bar,
      .debug-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: #f4f4f4;
        color: #212121;
        font-weight: 750;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 16px;
        letter-spacing: -0.01em;
      }

      .subtitle,
      .conversation-meta,
      .debug-line {
        color: #b4b4b4;
      }

      .subtitle {
        margin-top: 2px;
        font-size: 12px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 8px;
        border-radius: 999px;
        background: #303030;
        color: #ececec;
        font-size: 11px;
        font-weight: 650;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Única ação colorida do cabeçalho: busca de novo tudo no ChatGPT. */
      .sync-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid #10a37f;
        border-radius: 999px;
        background: rgb(16 163 127 / 14%);
        color: #4cd3a8;
        font-size: 11px;
        font-weight: 700;
      }

      .sync-button:hover:not(:disabled),
      .sync-button:focus-visible {
        background: #10a37f;
        color: #ffffff;
        outline: none;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #d1d1d1;
      }

      /* Busca */

      .search {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .search-row {
        display: flex;
        gap: 8px;
      }

      .field {
        width: 100%;
        min-height: 40px;
        padding: 0 12px;
        border: 1px solid #424242;
        border-radius: 10px;
        background: #2f2f2f;
        color: #f4f4f4;
        outline: none;
      }

      .field:focus {
        border-color: #8e8e8e;
        box-shadow: 0 0 0 3px rgb(255 255 255 / 10%);
      }

      .segmented {
        display: inline-flex;
        padding: 3px;
        border: 1px solid #424242;
        border-radius: 10px;
        background: #2f2f2f;
      }

      .segment {
        border: 0;
        border-radius: 7px;
        padding: 0 10px;
        background: transparent;
        color: #b4b4b4;
        font-size: 12px;
        font-weight: 650;
      }

      .segment.active {
        background: #f4f4f4;
        color: #212121;
      }

      .search-note {
        margin-top: 8px;
        font-size: 11px;
        color: #b4b4b4;
      }

      .button {
        min-height: 40px;
        border: 0;
        border-radius: 10px;
        padding: 0 14px;
        font-weight: 680;
      }

      .button-primary {
        background: #f4f4f4;
        color: #212121;
      }

      .button-secondary {
        border: 1px solid #424242;
        background: #2f2f2f;
        color: #ececec;
      }

      .text-button {
        border: 0;
        padding: 4px;
        background: transparent;
        color: #ececec;
        font-size: 12px;
        font-weight: 680;
      }

      /* Pastas ficam no topo fixo para continuarem alcançáveis durante o arraste. */

      .folders {
        margin-top: 12px;
        border: 1px solid #383838;
        border-radius: 12px;
        background: #262626;
      }

      .folders-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 9px 12px;
        border: 0;
        background: transparent;
        color: #ececec;
        font-size: 12px;
        font-weight: 700;
      }

      .folders-toggle::before {
        content: "▾";
        color: #9b9b9b;
      }

      .folders-toggle[aria-expanded="false"]::before {
        content: "▸";
      }

      .folders-toggle-label {
        flex: 1;
        text-align: left;
      }

      .folders-active {
        overflow: hidden;
        color: #b4b4b4;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .folder-list {
        display: grid;
        gap: 2px;
        max-height: 30vh;
        overflow-y: auto;
        padding: 0 6px 6px;
      }

      .folder {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 7px 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: #d1d1d1;
        font-size: 12px;
        text-align: left;
      }

      /* Filhos sem eventos de ponteiro evitam dragleave falso ao cruzar o texto. */
      .folder > * {
        pointer-events: none;
      }

      .folder:hover {
        background: #333333;
      }

      .folder.active {
        background: #3a3a3a;
        color: #ffffff;
        font-weight: 680;
      }

      .folder-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .folder-count {
        flex: 0 0 auto;
        color: #9b9b9b;
        font-size: 11px;
      }

      .folder-separator {
        height: 1px;
        margin: 4px 8px;
        background: #383838;
      }

      .dragging .folder[data-project-id] {
        border-style: dashed;
        border-color: #4a4a4a;
      }

      .folder.drop-target {
        border-style: solid !important;
        border-color: #f4f4f4 !important;
        background: #f4f4f4;
        color: #212121;
      }

      .folder.drop-target .folder-count {
        color: #212121;
        font-weight: 700;
      }

      /* Lista */

      .selection-bar {
        margin: 10px 0;
      }

      .selection-count {
        font-size: 12px;
        color: #b4b4b4;
      }

      .list {
        display: grid;
        gap: 8px;
      }

      .conversation {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 4px 10px;
        padding: 10px 8px 10px 12px;
        border: 1px solid #383838;
        border-radius: 12px;
        background: #2f2f2f;
        user-select: none;
      }

      .conversation[draggable="true"] {
        cursor: grab;
      }

      .conversation.selected {
        border-color: #777777;
        background: #383838;
      }

      .conversation-in-project,
      .conversation-missing {
        opacity: 0.75;
      }

      .conversation-pending {
        border-style: dashed;
        opacity: 0.5;
        cursor: progress !important;
      }

      .conversation input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: #f4f4f4;
      }

      .checkbox-placeholder {
        width: 16px;
      }

      .conversation-content {
        min-width: 0;
      }

      .conversation-title {
        display: block;
        overflow: hidden;
        font-size: 13px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .conversation-meta {
        display: block;
        margin-top: 3px;
        font-size: 11px;
      }

      .conversation-preview {
        display: -webkit-box;
        overflow: hidden;
        margin-top: 5px;
        color: #b4b4b4;
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #b4b4b4;
      }

      .icon-button:hover,
      .icon-button:focus-visible {
        background: #4a4a4a;
        color: #ffffff;
        outline: none;
      }

      .expand-button svg {
        transition: transform 120ms ease;
      }

      .expand-button[aria-expanded="true"] svg {
        transform: rotate(180deg);
      }

      .conversation-details {
        grid-column: 1 / -1;
        display: grid;
        gap: 8px;
        margin: 6px 0 2px 26px;
        padding-left: 10px;
        border-left: 2px solid #4a4a4a;
        font-size: 12px;
        line-height: 1.45;
        user-select: text;
        cursor: auto;
      }

      .context-label {
        display: block;
        margin-bottom: 2px;
        color: #9b9b9b;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .context-text {
        display: -webkit-box;
        overflow: hidden;
        color: #e0e0e0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
        line-clamp: 4;
      }

      .context-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: #9b9b9b;
        font-size: 11px;
      }

      .drag-ghost {
        position: fixed;
        top: -1000px;
        left: 0;
        padding: 6px 10px;
        border-radius: 8px;
        background: #f4f4f4;
        color: #212121;
        font-size: 12px;
        font-weight: 700;
      }

      /* Barra de seleção e "Mover para…" */

      .action-bar {
        position: relative;
        flex: none;
        display: none;
        padding: 10px 16px;
        background: #212121;
        border-top: 1px solid #383838;
      }

      .action-bar.visible {
        display: block;
      }

      .action-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .action-row .selection-count {
        flex: 1 1 100%;
      }

      .action-row .button {
        min-height: 36px;
      }

      .move-menu {
        position: absolute;
        right: 16px;
        bottom: calc(100% + 6px);
        left: 16px;
        padding: 8px;
        border: 1px solid #4a4a4a;
        border-radius: 12px;
        background: #2a2a2a;
        box-shadow: 0 8px 24px rgb(0 0 0 / 45%);
      }

      .move-options {
        display: grid;
        gap: 2px;
        max-height: 40vh;
        margin-top: 6px;
        overflow-y: auto;
      }

      .move-option {
        padding: 8px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #ececec;
        font-size: 12px;
        text-align: left;
      }

      .move-option:hover,
      .move-option:focus-visible {
        background: #3a3a3a;
        outline: none;
      }

      .move-empty {
        padding: 8px 10px;
        color: #9b9b9b;
        font-size: 12px;
      }

      /* Estados e avisos */

      .empty-state,
      .notice {
        padding: 18px 14px;
        border: 1px dashed #4a4a4a;
        border-radius: 12px;
        color: #b4b4b4;
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
      }

      .notice {
        display: none;
        margin-bottom: 12px;
        border-style: solid;
        text-align: left;
      }

      .notice.visible {
        display: block;
      }

      .notice.error {
        border-color: #777777;
        background: #303030;
        color: #f4f4f4;
      }

      .notice-action {
        display: block;
        margin-top: 10px;
        padding: 6px 12px;
        border: 1px solid #6f6f6f;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font-size: 12px;
      }

      .notice-action:hover {
        background: #3a3a3a;
      }

      /* Debug */

      .debug-card {
        overflow: hidden;
        border: 1px solid #383838;
        border-radius: 12px;
        background: #2f2f2f;
      }

      .debug-heading {
        padding: 10px 12px;
        border-bottom: 1px solid #424242;
      }

      .debug-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 700;
      }

      .badge {
        flex: 0 0 auto;
        padding: 3px 6px;
        border-radius: 6px;
        background: #424242;
        color: #cdcdcd;
        font-size: 10px;
      }

      .debug-output {
        padding: 10px 12px;
        background: #171717;
        color: #d1d1d1;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 10px;
        line-height: 1.6;
      }

      .debug-time {
        color: #ffffff;
      }

      .switch {
        position: relative;
        width: 30px;
        height: 17px;
        border-radius: 99px;
        background: #676767;
        border: 0;
        padding: 0;
      }

      .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        right: 3px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #f4f4f4;
      }

      .switch[aria-checked="false"] {
        background: #424242;
      }

      .switch[aria-checked="false"]::after {
        right: 16px;
        background: #9b9b9b;
      }

      footer {
        padding: 10px 16px 14px;
        color: #8e8e8e;
        font-size: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand-row">
          <div class="brand">
            <div class="brand-mark">CM</div>
            <div>
              <h1>ChatGPT Manager</h1>
              <p class="subtitle">Organize conversas em massa</p>
            </div>
          </div>
          <div class="header-actions">
            <span class="status" id="connection-status"><span class="status-dot"></span>Pronto</span>
            <button class="sync-button" id="sync-button" type="button" title="Buscar novamente todas as conversas e Projetos no ChatGPT">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3M5 3v5h5M19 21v-5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Sincronizar
            </button>
          </div>
        </div>
        <nav class="tabs" role="tablist" aria-label="Modos do painel">
          <button class="tab active" id="tab-organize" type="button" role="tab" aria-selected="true" aria-controls="view-organize">Organizar</button>
          <button class="tab" id="tab-debug" type="button" role="tab" aria-selected="false" aria-controls="view-debug">Debug</button>
        </nav>
      </header>

      <section class="toolbar" id="organize-toolbar" aria-label="Busca e pastas">
        <div class="notice" id="notice" role="status"></div>

        <div id="workspace" hidden>
          <form class="search" id="search-form">
            <input
              class="field"
              id="search-query"
              type="search"
              aria-label="Buscar conversas"
              placeholder="Filtrar por título"
            />
            <div class="search-row">
              <div class="segmented" role="group" aria-label="Modo de busca">
                <button class="segment active" id="mode-title" type="button" aria-pressed="true">Título</button>
                <button class="segment" id="mode-content" type="button" aria-pressed="false">Conteúdo</button>
              </div>
              <button class="button button-primary" id="search-submit" type="submit" hidden>Buscar</button>
            </div>
          </form>
          <p class="search-note" id="search-note" hidden></p>

          <section class="folders" aria-label="Pastas">
            <button class="folders-toggle" id="folders-toggle" type="button" aria-expanded="true">
              <span class="folders-toggle-label">Pastas</span>
              <span class="folders-active" id="folders-active"></span>
            </button>
            <div class="folder-list" id="folder-list"></div>
          </section>

          <div class="selection-bar">
            <div>
              <p class="selection-count" id="list-summary"></p>
              <p class="selection-count" id="freshness"></p>
            </div>
            <button class="text-button" id="select-visible" type="button">Selecionar visíveis</button>
          </div>
        </div>
      </section>

      <main class="scroll-area" id="view-organize" role="tabpanel" aria-labelledby="tab-organize">
        <div id="load-panel">
          <div class="empty-state">Carregando…</div>
        </div>

        <div class="list" id="conversation-list" aria-label="Conversas"></div>

        <footer>ChatGPT Manager · operações executadas com sua sessão atual</footer>
      </main>

      <main class="scroll-area" id="view-debug" role="tabpanel" aria-labelledby="tab-debug" hidden>
        <section class="debug-card" aria-labelledby="debug-title">
          <div class="debug-heading">
            <div class="debug-title" id="debug-title">
              <span>Modo debug</span>
              <span class="badge">ATIVO</span>
            </div>
            <button class="switch" id="debug-toggle" type="button" role="switch" aria-checked="true" aria-label="Desativar modo debug"></button>
          </div>
          <div class="debug-output" id="debug-output" aria-label="Eventos recentes de depuração">
            <div class="debug-line">Aguardando eventos…</div>
          </div>
        </section>
      </main>

      <div class="action-bar" id="action-bar">
        <div class="move-menu" id="move-menu" hidden>
          <input
            class="field"
            id="move-filter"
            type="search"
            aria-label="Filtrar Projetos de destino"
            placeholder="Filtrar Projetos"
          />
          <div class="move-options" id="move-options" role="listbox" aria-label="Projetos de destino"></div>
        </div>
        <div class="action-row">
          <span class="selection-count" id="selection-summary"></span>
          <button class="button button-primary" id="move-open" type="button" aria-haspopup="listbox">Mover para…</button>
          <button class="button button-secondary" id="delete-button" type="button">Excluir</button>
          <button class="button button-secondary" id="clear-button" type="button">Limpar</button>
        </div>
      </div>
    </div>
    <script type="module" src="dist/sidepanel.js"></script>
  </body>
</html>
